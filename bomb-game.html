<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="icon" href="data:," />
    <title>炸弹迷宫 - 马里奥学习系统</title>

    <link rel="stylesheet" href="./bomb-game.css?v=1.2" />
  </head>
  <body>
    <div class="bomb-game-app">
      <header class="bomb-topbar">
        <div class="bomb-hud" aria-label="游戏状态">
          <span class="hud-pill">❤️ <strong id="bombHp">3</strong></span>
          <span class="hud-pill">💣 <strong id="bombAmmo">3</strong></span>
          <span class="hud-pill">🍄 <strong id="mushroomLeft">0</strong></span>
          <span class="hud-pill">关卡 <strong id="bombLevel">1-1/5</strong></span>
          <span class="hud-pill">威力 <strong id="bombPower">1</strong></span>
        </div>
        <nav class="bomb-actions">
          <button id="startBombGame" type="button">开始</button>
          <button id="restartBombGame" type="button">重开</button>
          <button id="bombAvatarToggle" type="button" aria-expanded="false" aria-controls="bombAvatarMenu" aria-label="选择主角，当前小飞星">选择主角</button>
          <button id="bombSoundToggle" type="button" aria-label="关闭音效" aria-pressed="true" title="关闭音效">🔊</button>
          <a href="./index.html">返回</a>
          <div class="bomb-avatar-menu" id="bombAvatarMenu" role="group" aria-label="选择游戏主角" hidden>
            <button type="button" data-avatar="bomber" aria-pressed="false"><span class="avatar-option-icon" aria-hidden="true">💣</span><span>炸弹人</span></button>
            <button type="button" data-avatar="fly-star" aria-pressed="true"><span class="avatar-option-icon" aria-hidden="true">⭐</span><span>小飞星</span></button>
            <button type="button" data-avatar="super-mushroom" aria-pressed="false"><img src="./assets/sprites/super-mushroom-v1.png?v=1.0" width="48" height="48" alt="" /><span>超级蘑菇</span></button>
          </div>
        </nav>
      </header>

      <main class="bomb-stage">
        <canvas id="bombCanvas" width="1280" height="720" tabindex="0" aria-label="炸弹迷宫游戏"></canvas>
        <div class="bomb-message" id="bombMessage" aria-live="polite"></div>
        <section class="bomb-start-layer" id="bombStartLayer" aria-labelledby="bombStartTitle">
          <div class="bomb-start-panel">
            <h2 id="bombStartTitle">炸弹迷宫</h2>
            <button id="overlayStartBombGame" type="button">开始</button>
          </div>
        </section>
      </main>
    </div>

  <script src="./data/characters.js?v=1.0"></script>
  <script src="./data/pinyin-readings.js?v=1.0"></script>

  <script src="./src/bomb-audio.js?v=1.1"></script>
  <script src="./bomb-game.js?v=2.13"></script>
  <script type="module" src="./src/version-update.js?v=1.0.21"></script>
</body>
</html>
