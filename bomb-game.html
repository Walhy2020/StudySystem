<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="icon" href="data:," />
    <title>炸弹迷宫 - 马里奥学习系统</title>

    <link rel="stylesheet" href="./bomb-game.css?v=1.10" />
    <script src="./src/web-audio.js?v=1.0"></script>
  </head>
  <body>
    <div class="bomb-game-app">
      <header class="bomb-topbar">
        <div class="bomb-hud" aria-label="游戏状态">
          <span class="hud-pill">❤️ <strong id="bombHp">3</strong></span>
          <span class="hud-pill" title="剩余可同时释放的冰炸弹"><span id="attackHudIcon" aria-hidden="true">🧊</span><strong id="bombAmmo">1</strong></span>
          <span class="hud-pill">🍄 <strong id="mushroomLeft">0</strong></span>
          <span class="hud-pill">关卡 <strong id="bombLevel">3-1/5</strong></span>
          <span class="hud-pill"><span id="attackRangeLabel">冰长</span><strong id="bombPower">2</strong></span>
        </div>
        <div class="bomb-moons" id="bombMoons" role="img" aria-label="学习月亮 0/5">
          <span class="moon-hud-icon is-lit" aria-hidden="true"></span><span aria-hidden="true">×</span><strong id="bombMoonCount" aria-hidden="true">0</strong>
        </div>
        <nav class="bomb-actions">
          <button id="startBombGame" type="button">开始</button>
          <button id="restartBombGame" type="button">重开</button>
          <button id="bombSettingsToggle" type="button" aria-expanded="false" aria-controls="bombSettingsMenu">设置</button>
          <a href="./index.html">返回</a>
          <div class="bomb-settings-menu" id="bombSettingsMenu" role="group" aria-label="游戏设置" hidden>
          <button id="bombAvatarToggle" type="button" aria-expanded="false" aria-controls="bombAvatarMenu" aria-label="选择主角，当前小飞星">选择主角</button>
          <button id="bombAttackToggle" type="button" aria-expanded="false" aria-controls="bombAttackMenu" aria-label="设置小蘑菇与冰炸弹快捷键">攻击设置</button>
          <button id="bombSoundToggle" type="button" aria-label="关闭音效" aria-pressed="true" title="关闭音效">🔊 声音</button>
          <button id="bombFullscreenToggle" type="button">全屏</button>
          <div class="bomb-avatar-menu" id="bombAvatarMenu" role="group" aria-label="选择游戏主角" hidden>
            <button type="button" data-avatar="bomber" aria-pressed="false"><span class="avatar-option-icon" aria-hidden="true">💣</span><span>炸弹人</span></button>
            <button type="button" data-avatar="fly-star" aria-pressed="true"><span class="avatar-option-icon" aria-hidden="true">⭐</span><span>小飞星</span></button>
            <button type="button" data-avatar="super-mushroom" aria-pressed="false"><img src="./assets/sprites/super-mushroom-v1.png?v=1.0" width="48" height="48" alt="" /><span>超级蘑菇</span></button>
          </div>
          <div class="bomb-attack-menu" id="bombAttackMenu" role="group" aria-label="双攻击设置" hidden>
            <label for="mushroomAttackKey">🍄 小蘑菇快捷键</label>
            <button id="mushroomAttackKey" class="bomb-binding-button" type="button" aria-label="捕捉小蘑菇快捷键" aria-pressed="false" aria-describedby="bombBindingStatus"></button>
            <label for="iceBombAttackKey">🧊 冰炸弹快捷键</label>
            <button id="iceBombAttackKey" class="bomb-binding-button" type="button" aria-label="捕捉冰炸弹快捷键" aria-pressed="false" aria-describedby="bombBindingStatus"></button>
            <p id="bombBindingStatus" class="bomb-attack-help" role="status"></p>
            <label for="mushroomThrowDistance">投掷距离 <output id="mushroomThrowDistanceValue" for="mushroomThrowDistance">3 格</output></label>
            <input id="mushroomThrowDistance" type="range" min="1" max="8" step="1" value="3" aria-label="小蘑菇投掷距离，单位格" />
            <p class="bomb-attack-help" data-gamepad-status role="status">连接手柄后按一下按钮</p>
          </div>
            <div class="bomb-battery-settings">
              <p class="bomb-attack-help" id="bombGamepadBattery" role="status">手柄电量：未知</p>
              <button id="readGamepadBattery" type="button">读取手柄电量</button>
            </div>
          </div>
        </nav>
      </header>

      <main class="bomb-stage">
        <canvas id="bombCanvas" width="1280" height="720" tabindex="0" aria-label="炸弹迷宫游戏"></canvas>
        <div class="bomb-message" id="bombMessage" hidden aria-hidden="true"></div>
        <section class="bomb-start-layer" id="bombStartLayer" aria-labelledby="bombStartTitle">
          <div class="bomb-start-panel">
            <h2 id="bombStartTitle">炸弹迷宫</h2>
            <button id="overlayStartBombGame" type="button">开始</button>
            <p class="bomb-gamepad-help">十字键移动，攻击方向自动跟随<br />停下后左摇杆瞄准 · L3 默认无动作<br />默认 A / × 小蘑菇 · B / ○ 冰炸弹（设置中可改）<br />R1 返回 · R2 全屏<br />当前小蘑菇键或 Start / Options 确认开始、继续、下一关<br />右摇杆菜单光标 · A / × 点选 · Y / △ 回游戏</p>
            <p class="bomb-gamepad-help" data-gamepad-status role="status">连接手柄后按一下按钮</p>
          </div>
        </section>
      </main>
    </div>

  <script src="./data/characters.js?v=1.0"></script>
  <script src="./data/pinyin-readings.js?v=1.0"></script>

  <script src="./src/bomb-audio.js?v=1.4"></script>
  <script src="./src/fullscreen-shell.js?v=1.0"></script><script src="./src/controller-mouse.js?v=1.0"></script><script src="./src/gamepad-cursor.js?v=1.13"></script>
  <script src="./src/bomb-bindings.js?v=1.5"></script>
  <script src="./src/bomb-gamepad.js?v=1.7"></script>
  <script src="./src/bomb-gamepad-battery.js?v=1.1"></script>
  <script src="./bomb-game.js?v=2.43"></script>
  <script type="module" src="./src/version-update.js?v=1.0.63"></script>
</body>
</html>
