<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate" />
  <link rel="icon" href="data:," />
  <title>马里奥学习系统 · Book1</title>
  <link rel="stylesheet" href="./book-learning.css?v=2.1" />
  <link rel="stylesheet" href="./module-navigation.css?v=1.0" />
  <script src="./src/web-audio.js?v=1.0"></script>
</head>
<body>
  <div class="book-shell">
    <header class="book-topbar">
      <div class="book-brand"><span>马里奥学习系统</span><h1>Book1 字母启蒙</h1></div>
      <nav class="book-nav" aria-label="学习模块"><a href="./pinyin.html">拼音</a>
        <a href="./index.html">汉字</a>
        <span class="is-active" aria-current="page">Book1</span>
        <a href="./theme-learning.html">主题学习</a>
        <a href="./scenario-learning.html">情景模式</a>
        <a href="./review-learning.html">总复习</a>
        <a href="./phonetics.html">音标</a>
      </nav>
    </header>

    <main>
      <section class="book-hero" aria-labelledby="bookTitle">
        <div><span class="book-kicker">Oxford Phonics World 1</span><h2 id="bookTitle">Book1 字母学习</h2><p>按原书 A–Z 分为 26 组，每组学习 1 个字母和对应的 4 个单词。</p><p class="migration-note" id="migrationNote" hidden>已只读导入旧系统的 Book1 进度。</p></div>
        <div class="book-summary"><strong id="learnedCount">0</strong><span>已学习 / 130</span></div>
      </section>

      <section class="book-theme-picker" id="themePicker" aria-label="Book1 主题选择">
        <div class="book-picker-heading"><span class="book-kicker">CHOOSE A LETTER</span><h2>选择一个字母组</h2><p>每组 1 个字母、4 个原书单词：先认识，再遮住答案复习，最后看词选图练习。</p></div>
        <div class="book-theme-list" id="themeList"></div>
      </section>

      <section class="book-learning-view" id="learningView" hidden aria-labelledby="stageTitle">
        <header class="book-learning-head">
          <div><button class="back-themes" id="backToThemes" type="button">← 返回主题</button><span class="book-kicker" id="activeThemeLabel"></span><h2 id="stageTitle">第一部分 · 认识单词</h2></div>
          <div class="book-stage-switch" aria-label="学习阶段">
            <button class="stage-button is-active" id="learnStage" type="button" aria-pressed="true">1 认识单词</button>
            <button class="stage-button" id="reviewStage" type="button" aria-pressed="false">2 复习单词</button>
            <button class="stage-button" id="practiceStage" type="button" aria-pressed="false">3 互动练习</button>
          </div>
        </header>
        <div class="book-activity">
          <section class="book-picture-panel" aria-label="主题配图">
            <div class="picture-caption"><span id="scenePrompt">点击一张图片</span><strong id="sessionProgress">0 个单词</strong></div>
            <div class="book-picture-grid" id="pictureGrid"></div>
          </section>
          <section class="book-info-panel" id="learnPanel">
            <div class="book-word-card book-placeholder" id="wordCard" role="status"></div>
            <div class="book-completion" id="completionPanel"><button class="primary-action" id="completeTheme" type="button">学习完毕</button><p id="completionStatus"></p></div>
          </section>
          <section class="book-info-panel" id="practicePanel" hidden>
            <span class="book-kicker">LISTEN &amp; TOUCH</span><p class="practice-progress" id="roundProgress">第 1/1 题</p>
            <h3 id="practiceInstruction">找到对应的图片</h3><button class="primary-action" id="playInstruction" type="button">🔊 播放指令</button>
            <p class="practice-feedback" id="practiceFeedback" role="status"></p>
            <button class="primary-action" id="nextPractice" type="button" hidden>下一题</button>
          </section>
          <section class="book-info-panel" id="resultPanel" hidden><span class="result-star" aria-hidden="true">★</span><h3>本主题练习完成！</h3><p id="resultScore">0/0</p><button class="primary-action" id="restartRound" type="button">再来一轮</button></section>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="./book-learning-themes.js?v=1.4"></script>
  <script src="./src/fullscreen-shell.js?v=1.0"></script><script src="./src/gamepad-cursor.js?v=1.10"></script>
  <script type="module" src="./src/version-update.js?v=1.0.58"></script>
</body>
</html>
