<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f7ee">
  <title>贪吃蛇 · 小飞星汉字长龙 - 马里奥学习系统</title>
  <link rel="icon" href="./assets/snake/flystar-head-v1.png?v=1.0">
  <link rel="stylesheet" href="./snake-game.css?v=1.1">
  <script src="./src/web-audio.js?v=1.0"></script>
</head>
<body>
  <main class="app">
    <header class="game-topbar">
      <div class="mission" aria-label="当前目标">
        <span id="batchCount"></span>
        <span class="mission-label" id="missionLabel">找汉字</span>
        <strong id="targetGlyph"></strong>
        <button id="speakButton" type="button" aria-label="听目标字的读音" title="听读音">♪</button>
      </div>
      <nav class="game-actions" aria-label="游戏操作">
        <button id="startButton" type="button">开始</button>
        <button id="resetButton" type="button">重开</button>
        <button id="settingsButton" type="button" aria-expanded="false" aria-controls="settingsMenu">设置</button>
        <a id="snakeBack" href="./index.html">返回</a>
        <div id="settingsMenu" class="settings-menu" role="group" aria-label="游戏设置" hidden>
          <button id="muteButton" type="button">声音开启 · L1</button>
          <button id="fullscreenButton" type="button">全屏 · R2</button>
          <button id="autoButton" type="button" aria-pressed="false">自动演示</button>
          <p>方向键 / WASD / 左摇杆转向，也可拖动场地。空格暂停，A / Start 继续。</p>
          <p>右摇杆 / Y 菜单 · R1 返回 · View 切换鼠标</p>
          <button id="closeSettings" type="button">关闭设置</button>
        </div>
      </nav>
    </header>
    <section class="stage" id="stage" aria-label="贪吃蛇游戏">
      <canvas id="game" tabindex="0" aria-label="小飞星游戏区域，方向键或 WASD 转向，空格暂停"></canvas>
      <div id="loading" class="loading">小飞星准备出发…</div>
      <div id="pauseOverlay" class="pause-overlay" hidden><span id="pauseTitle">休息一下</span><button id="resumeButton" type="button">继续出发</button></div>
      <div id="message" class="sr-only" aria-live="polite"></div>
      <div class="direction-pad" aria-label="方向控制"><button data-direction="up" aria-label="向上" type="button">↑</button><button data-direction="left" aria-label="向左" type="button">←</button><button data-direction="down" aria-label="向下" type="button">↓</button><button data-direction="right" aria-label="向右" type="button">→</button></div>
    </section>
  </main>
  <script src="./data/characters.js?v=1.0"></script>
  <script src="./data/pinyin-readings.js?v=1.0"></script>
  <script src="./src/fullscreen-shell.js?v=1.4"></script><script src="./src/controller-mouse.js?v=1.2"></script><script src="./src/gamepad-cursor.js?v=1.18"></script>
  <script src="./src/bomb-gamepad.js?v=1.7"></script>
  <script type="module" src="./snake-game.js?v=1.1"></script>
  <script type="module" src="./src/version-update.js?v=1.0.81"></script>
</body>
</html>
