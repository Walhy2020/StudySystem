<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>马里奥学习系统 · 单词</title>
  <link rel="stylesheet" href="./styles.css?v=2.2" />
  <link rel="stylesheet" href="./word-learning.css?v=1.3" />
  <link rel="stylesheet" href="./module-navigation.css?v=1.1" />
  <script src="./src/web-audio.js?v=1.0"></script>
</head>
<body>
<div class="app-shell word-learning-shell">
  <header class="topbar">
    <div class="brand"><h1>马里奥学习系统</h1><p id="appVersionLabel">版本加载中</p></div>
    <nav class="module-tabs" aria-label="学习模块">
      <a class="module-tab" href="./pinyin.html">拼音</a>
      <a class="module-tab" href="./index.html">汉字</a>
      <span class="module-tab is-active" aria-current="page">单词</span>
      <a class="module-tab" href="./book-learning.html">Book1</a>
      <a class="module-tab" href="./theme-learning.html">主题</a>
      <a class="module-tab" href="./scenario-learning.html">情景</a>
      <a class="module-tab" href="./review-learning.html">总复习</a>
      <a class="module-tab" href="./phonetics.html">音标</a>
    </nav>
    <div class="top-actions"><a class="ghost-button" href="./bomb-game.html?v=1.0">炸弹迷宫</a></div>
  </header>
  <main class="workspace">
    <section class="stage word-lesson">
      <div class="map-visual">
        <img src="./assets/backgrounds/hanzi-kingdom-v2.png?v=1.0" alt="单词学习冒险王国" />
        <div class="map-actions" role="group" aria-label="单词页操作"><button class="ghost-button danger" id="resetWords" type="button">重置单词状态</button></div>
        <div class="map-overlay"><span>单词冒险</span><strong>看图识词</strong></div>
        <div class="map-economy"><div class="star-counter" aria-label="单词星星"><span aria-hidden="true">⭐</span><strong id="starCount">0</strong></div></div>
        <button class="map-next-batch" id="nextBatch" type="button">下一批</button>
      </div>
      <section class="challenge" aria-live="polite">
        <div class="task-status"><strong id="phaseLabel">等待开始</strong><span id="taskProgress"></span></div>
        <div class="word-card">
          <div class="word-picture-panel">
            <div class="hanzi-panel">
              <div class="word-picture" id="wordPicture" aria-label="当前单词配图"><span class="empty-list">开始学习后显示配图</span></div>
              <div id="reviewRoundBadge" class="review-round-badge hidden"></div>
            </div>
            <p class="word-translation" id="wordTranslation" hidden></p>
          </div>
          <div class="pinyin-line word-question">
            <div class="word-answer">
              <button id="currentWord" type="button" aria-label="显示单词和音标" aria-controls="wordPhonetic phonemeBreakdown" disabled>开始</button>
              <button class="word-ipa" id="wordPhonetic" type="button" aria-label="拆解音标" aria-expanded="false" aria-controls="phonemeBreakdown" hidden></button>
              <div class="phoneme-breakdown" id="phonemeBreakdown" aria-label="音素拆解" hidden></div>
            </div>
          </div>
        </div>
        <div class="voice-row">
          <button class="primary-button start-challenge-button" id="startDaily" type="button">今日新单词</button>
          <button class="primary-button start-challenge-button start-review-button" id="startReview" type="button">复习单词</button>
          <button class="primary-button icon-action sound-action hidden" id="speakCurrent" type="button" aria-label="朗读当前单词"><span aria-hidden="true">🔊</span></button>
          <button class="plain-button icon-action correct-action hidden" id="markCorrect" type="button" aria-label="认识"><span aria-hidden="true">√</span></button>
          <button class="plain-button icon-action wrong-action hidden" id="markWrong" type="button" aria-label="不认识"><span aria-hidden="true">×</span></button>
          <button class="plain-button icon-action mastery-action hidden" id="markMastered" type="button" aria-label="完全认识"><span aria-hidden="true">★</span></button>
        </div>
        <p class="feedback" id="feedback" role="status"></p>
      </section>
    </section>
    <aside class="side-panel">
      <section class="panel-block library-panel">
        <h2>单词库状态</h2>
        <div class="library-stats">
          <div><span>已认识</span><strong id="knownCount">0</strong></div>
          <div><span>完全认识</span><strong id="masteredCount">0</strong></div>
          <div><span>错词库</span><strong id="wrongCount">0</strong></div>
          <div><span>到期复习</span><strong id="dueCount">0</strong></div>
          <div class="wide-stat"><span>总进度</span><strong id="progressCount">0/0</strong></div>
        </div>
      </section>
      <section class="panel-block today-new-panel"><h2>今日新单词</h2><div class="word-list" id="todayNewList"></div><button class="finish-new-button hidden" id="finishNewWords" type="button">今日新单词学习完毕</button></section>
      <section class="panel-block review-wrong-panel"><h2>复习错词</h2><div class="word-list" id="reviewWrongList"></div></section>
    </aside>
  </main>
  <p id="saveNotice" role="status" hidden>浏览器未能保存单词进度，请检查本地存储设置。</p>
</div>
<script type="module" src="./word-learning.js?v=1.14"></script>
<script src="./src/fullscreen-shell.js?v=1.4"></script><script src="./src/controller-mouse.js?v=1.2"></script><script src="./src/gamepad-cursor.js?v=1.18"></script>
<script type="module" src="./src/version-update.js?v=1.0.87"></script>
</body>
</html>
